name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag against versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(grep -E '^\s*versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "$version" != "$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract changelog section
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.AUTOSCOPE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUTOSCOPE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autoscope.jks"
          echo "AUTOSCOPE_KEYSTORE=$RUNNER_TEMP/autoscope.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          AUTOSCOPE_KEYSTORE_PASSWORD: ${{ secrets.AUTOSCOPE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and name the APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify "$apk"
          cp "$apk" "AutoScope-$VERSION.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AutoScope-$VERSION.apk" --title "AutoScope $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
